name: flutter_app_base
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cloud_firestore: ^5.6.6
  connectivity_plus: ^6.1.3
  firebase_auth: ^5.5.2
  firebase_core: ^3.13.0
  flutter_native_splash: ^2.4.6
  font_awesome_flutter: ^10.8.0
  logger: ^2.5.0
  provider: ^6.1.4
  collection: ^1.19.1
  google_fonts: ^6.2.1
  flutter_svg_provider: ^1.0.7
  mobile_scanner: ^7.0.0
  table_calendar: ^3.1.3
  http: ^1.4.0
  google_generative_ai: ^0.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path_android: "assets/app_icons/app_icon.png"
  # adaptive_icon_background: "#d5dde2" # only available for Android 8.0 devices and above
  # adaptive_icon_foreground: "assets/images/finexa/launcher_foreground.png" # only available for Android 8.0 devices and above

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/
    - assets/images/partners/
    - assets/images/memoji/
    - assets/images/challenges/
    - assets/images/home/
    - assets/app_icons/

  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans_Regular.ttf
        - asset: assets/fonts/DMSans_Medium.ttf
        - asset: assets/fonts/DMSans_Bold.ttf

    - family: IconlyBold
      fonts:
        - asset: assets/fonts/Iconly_Bold.ttf

    - family: IconlyBroken
      fonts:
        - asset: assets/fonts/Iconly_Light.ttf
